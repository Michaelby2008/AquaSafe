<main class="pagina-auth">
  <section class="card caja">
    <h1>
  <img src="Logo-pequeño.png" alt="Logo AquaSave" class="logo-titulo" />
  AquaSave
</h1>
    <p class="texto-suave">Reporta y da seguimiento a las fugas de agua potable de tu comunidad.</p>
    <h2>Iniciar sesión</h2>

    @if (error()) {
      <div class="alert alert-error" role="alert">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [class.invalido]="mensaje('email')"
          [attr.aria-invalid]="mensaje('email') ? true : null"
          aria-describedby="email-error"
        />
        @if (mensaje('email')) {
          <span id="email-error" class="error-campo">{{ mensaje('email') }}</span>
        }
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [class.invalido]="mensaje('password')"
          [attr.aria-invalid]="mensaje('password') ? true : null"
          aria-describedby="password-error"
        />
        @if (mensaje('password')) {
          <span id="password-error" class="error-campo">{{ mensaje('password') }}</span>
        }
      </div>

      <button class="btn" type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p>¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a></p>
  </section>
</main>
